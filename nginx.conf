server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # OAuth precisa chegar ao mesmo processo que criou o state e o PKCE.
  # Exponha apenas as rotas necessarias ao consentimento; a API restante
  # continua fora do dominio publico do dashboard.
  location ~ ^/oauth/contaazul/(start|callback|status)$ {
    proxy_pass http://eron-api:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
