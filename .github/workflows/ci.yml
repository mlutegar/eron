name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # node:sqlite (backend) exige >= 22.13
          cache: npm
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run build --prefix server
